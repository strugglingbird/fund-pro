services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quant_workbench}
      MYSQL_USER: ${MYSQL_USER:-quant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.deploy}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.deploy}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  quant-api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    restart: unless-stopped
    environment:
      DATABASE_ENGINE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quant_workbench}
      MYSQL_USER: ${MYSQL_USER:-quant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.deploy}
      FUND123_ESTIMATE_URL: ${FUND123_ESTIMATE_URL:-}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.deploy}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env.deploy}
      SERVER_IP: ${SERVER_IP:-39.106.56.114}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - quant-api

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
